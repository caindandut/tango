services:
  - type: web
    name: tango-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/app.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tango-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false

databases:
  - name: tango-db
    plan: free
